name: factledger
version: "1.0.0"
manifest_version: 2
description: >-
  Typed-facts ledger with structural truth — record, search, and audit facts the
  agent actually knows, with a supersede history instead of overwrites. Add,
  show, search, check integrity, list stale facts, or export JSON.
license: MIT
requires_hermes: ">=0.19"
homepage: https://github.com/explorelifehus-eng/factledger
author: GiaVaSwNi
tags:
  - memory
  - facts
  - ledger
  - truth
config_schema:
  db_path:
    type: str
    description: >-
      Optional custom path to the ledger facts.tsv. Defaults to the per-profile
      plugin data dir (<hermes home>/plugin-data/factledger/facts.tsv).
provides_tools:
  - factledger_add
  - factledger_show
  - factledger_search
  - factledger_history
  - factledger_compile
  - factledger_stale
  - factledger_export
  - factledger_check
  - factledger_stats
